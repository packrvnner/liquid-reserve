[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
]

# src/staking/KntqVault.sol is deployed from this profile, built for size: creating it has to fit in 2,000,000
# gas (the limit some wallets apply to HyperEVM's fast blocks). Everything else is deployed from the default one.
#   FOUNDRY_PROFILE=kntqvault forge inspect src/staking/KntqVault.sol:KntqVault bytecode
[profile.kntqvault]
optimizer_runs = 1
out = "out-kntqvault"
cache_path = "cache-kntqvault"

[rpc_endpoints]
elysium = "https://rpc.elysium.kinetiq.xyz"
hyperevm = "https://rpc.hyperliquid.xyz/evm"

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
